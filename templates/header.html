<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Foody & Ms.Foody</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --bg-primary: #f3f4f6;
            --bg-white: #ffffff;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-md: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .navbar {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            box-shadow: var(--shadow-md);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-list {
            list-style-type: none;
            margin: 0 auto;
            padding: 0;
            display: flex;
            align-items: center;
            width:100%;
            padding: 0 1rem;
        }

        .nav-item {
            display: inline;
            margin: 0 15px;
        }

        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
            border-radius: var(--radius-md);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover {
            color: var(--primary-color);
            background-color: var(--bg-primary);
            transform: translateY(-1px);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-right: auto;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .profile-link {
            color: var(--primary-color);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 2px solid var(--primary-color);
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-link:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .active {
            background-color: var(--bg-primary);
            color: var(--primary-color);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .nav-list {
                padding: 0 0.5rem;
            }

            .nav-item {
                margin: 0 0.5rem;
            }

            .logo {
                font-size: 1.1rem;
            }

            .nav-link {
                padding: 0.4rem 0.8rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul class="nav-list">
            <li class="nav-item">
                <a href="{% url 'index' %}" class="nav-link logo">
                    <i class="fas fa-utensils"></i> Mr.Foody & Ms.Foody
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'quick_bite' %}" class="nav-link {% if request.path == '/quick-bite/' %}active{% endif %}">
                    <i class="fas fa-hamburger"></i> Quick Bite
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'all_tables' %}" class="nav-link {% if request.path == '/all-tables/' %}active{% endif %}">
                    <i class="fas fa-th-large"></i> All Tables
                </a>
            </li>
            <div class="nav-right">
                <li class="nav-item">
                    <a href="{% url 'edit_profile' %}" class="profile-link {% if request.path == '/profile/' %}active{% endif %}">
                        <i class="fas fa-user-circle"></i> Profile
                    </a>
                </li>
            </div>
        </ul>
    </nav>
    <!-- Add spacing to prevent content from hiding under fixed navbar -->
    <div style="height: 70px;"></div>
</body>
</html>
